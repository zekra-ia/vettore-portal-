# Netlify: Next.js otomatik algılanır (OpenNext adaptörü). Her yayından önce veritabanı şeması güncellenir.
[build]
  command = "node scripts/migrate.mjs && node scripts/seed.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = ["node_modules/dejavu-fonts-ttf/ttf/DejaVuSans*.ttf", "forms/**", "assets/**"]
